[package]
name = "pacwrap"
version = "0.1.0"
edition = "2021"
description = "A configurable JSONC-driven output wrapper for pacman"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json_comments = "0.2"
regex = "1.11"
atty = "0.2"
base64 = "0.22"
